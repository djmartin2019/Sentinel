<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>Sentinel — Offline</title>
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        box-sizing: border-box;
        background:
          radial-gradient(ellipse 80% 40% at 50% -10%, rgba(30, 167, 255, 0.14), transparent 70%),
          #000;
        color: #ededed;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 100%;
        max-width: 360px;
        padding: 32px 24px;
        text-align: center;
        border: 1px solid #1f1f1f;
        border-radius: 12px;
        background: #0a0a0a;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
      }
      .dot {
        width: 10px;
        height: 10px;
        margin: 0 auto 16px;
        border-radius: 50%;
        background: #737373;
      }
      h1 { margin: 0 0 6px; font-size: 16px; font-weight: 600; }
      p { margin: 0 0 20px; font-size: 13px; color: #a1a1a1; line-height: 1.5; }
      button {
        font: inherit;
        font-size: 13px;
        padding: 8px 16px;
        border-radius: 8px;
        border: 1px solid rgba(30, 167, 255, 0.4);
        background: rgba(30, 167, 255, 0.1);
        color: #1ea7ff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="dot"></div>
      <h1>You're offline</h1>
      <p>Sentinel shows live uptime data and needs a connection.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
